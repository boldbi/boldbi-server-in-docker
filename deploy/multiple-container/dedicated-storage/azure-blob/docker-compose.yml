x-blob-storage-env: &blob-storage-env
  APP_BASE_URL: ""
  BOLD_SERVICES_AZUREBLOB_ACCESSKEY: ""
  BOLD_SERVICES_AZUREBLOB_ACCOUNT_NAME: ""
  BOLD_SERVICES_AZUREBLOB_CONNECTION_TYPE: ""
  BOLD_SERVICES_AZUREBLOB_STORAGE_URI: ""
  BOLD_SERVICES_STORAGETYPE: "1"
  BOLD_SERVICES_AZUREBLOB_CONTAINER_NAME: ""
  DEPLOY_MODE: "docker_multi_container"
  INSTALL_OPTIONAL_LIBS: "mongodb,mysql,influxdb,snowflake,oracle,clickhouse,google"
  BOLD_SERVICES_HOSTING_ENVIRONMENT: "docker"
  BOLD_SERVICES_PV_USED: "false"
  BOLD_SERVICES_CONSOLE_LOG_ENABLED: "true"

services:
  id-web:
    container_name: id_web_container
    image: syncfusion/bold-identity:17.1.30
    restart: always
    environment:
       <<: *blob-storage-env
    networks:
      - boldservices
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health-check"]
      interval: 10s
      timeout: 10s
      retries: 5

  id-api:
    container_name: id_api_container
    image: syncfusion/bold-identity-api:17.1.30
    restart: always
    environment:
       <<: *blob-storage-env
    networks:
      - boldservices
    depends_on:
      id-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health-check"]
      interval: 10s
      timeout: 10s
      retries: 5

  id-ums:
    container_name: id_ums_container
    image: syncfusion/bold-ums:17.1.30
    restart: always
    environment:
       <<: *blob-storage-env
    networks:
      - boldservices
    depends_on:
      id-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health-check"]
      interval: 10s
      timeout: 10s
      retries: 5

  bi-web:
    container_name: bi_web_container
    image: syncfusion/boldbi-server:17.1.30
    restart: always
    environment:
       <<: *blob-storage-env
    networks:
      - boldservices
    depends_on:
      id-web:
        condition: service_healthy
      id-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health-check"]
      interval: 10s
      timeout: 10s
      retries: 5

  bi-api:
    container_name: bi_api_container
    image: syncfusion/boldbi-server-api:17.1.30
    restart: always
    environment:
       <<: *blob-storage-env
    networks:
      - boldservices
    depends_on:
      bi-web:
        condition: service_started
      id-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health-check"]
      interval: 10s
      timeout: 10s
      retries: 5

  bi-jobs:
    container_name: bi_jobs_container
    image: syncfusion/boldbi-server-jobs:17.1.30
    restart: always
    environment:
       <<: *blob-storage-env
    networks:
      - boldservices
    depends_on:
      bi-web:
        condition: service_started
      id-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health-check"]
      interval: 10s
      timeout: 10s
      retries: 5

  bi-dataservice:
    container_name: bi_dataservice_container
    image: syncfusion/boldbi-designer:17.1.30
    restart: always
    environment:
       <<: *blob-storage-env
    networks:
      - boldservices
    depends_on:
      bi-web:
        condition: service_started
      id-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health-check"]
      interval: 10s
      timeout: 10s
      retries: 5

  bi-etl:
    container_name: bi_etl_container
    image: syncfusion/bold-etl:17.1.30
    restart: always
    environment:
       <<: *blob-storage-env
    networks:
      - boldservices
    depends_on:
      bi-web:
        condition: service_started
      id-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health-check"]
      interval: 10s
      timeout: 10s
      retries: 5

  bold-ai:
    container_name: bold_ai_container
    image: syncfusion/bold-ai:17.1.30
    restart: always
    environment:
       <<: *blob-storage-env
    networks:
      - boldservices
    depends_on:
      bi-web:
        condition: service_started
      id-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health-check"]
      interval: 10s
      timeout: 10s
      retries: 5

  boldbi-mcp-server:
    container_name: bold_mcp_container
    image: syncfusion/boldbi-mcp-server:17.1.30
    restart: always
    environment:
       <<: *blob-storage-env
    networks:
      - boldservices
    depends_on:
      bi-web:
        condition: service_started
      id-web:
        condition: service_healthy
    healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost/health-check"]
        interval: 10s
        timeout: 10s
        retries: 5

  reverse-proxy:
    container_name: nginx
    image: nginx
    restart: always
    volumes:
      - "<default_conf_path>:/etc/nginx/conf.d/default.conf"
      #- "<ssl_cert_file_path>:/etc/ssl/domain.crt"
      #- "<ssl_key_file_path>:/etc/ssl/domain.key"
    ports:
      - "8085:80"
      # - "443:443"
    environment:
      - NGINX_PORT=80
    networks:
      - boldservices
    depends_on:
      id-web:
        condition: service_started
      id-api:
        condition: service_started
      id-ums:
        condition: service_started
      bi-web:
        condition: service_started
      bi-api:
        condition: service_started
      bi-jobs:
        condition: service_started
      bi-dataservice:
        condition: service_started
      bold-ai:
        condition: service_started
      boldbi-mcp-server:
        condition: service_started

  pgdb:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_PASSWORD: <Password>
    volumes:
      - db_data:/var/lib/postgresql/data/
    networks:
      - boldservices

networks:
  boldservices:

volumes:
  db_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '<host_path_db_data>'
